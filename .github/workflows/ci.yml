name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image and exercise real container startup
        run: python3 tests/container_smoke.py

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .
      - name: Start registry and verify OAuth integration over HTTPS
        run: python tests/integration_oauth_smoke.py

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry-center-web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run frontend tests
        run: npm test
      - name: Build
        run: npm run build
