# Registry Center deployment configuration
# Copyright (c) 2026 Huawei Technologies Co., Ltd.
#
# Consumed by bin/install_service.sh (load_config, lines 37-50) when it is run
# from the repository root; the file is read as whitespace-trimmed KEY=VALUE
# lines, comments (#) are skipped by the case statement, and unknown keys are
# ignored silently. Only the four keys below have an effect. Command-line
# options override these values: --dir=PATH, --python=PATH, --no-deps.
# The script uses these defaults when the file or a key is absent:
# INSTALL_DIR=/opt/registry-center, PYTHON_PATH=<INSTALL_DIR>/venv/bin/python3,
# SERVICE_NAME=registry-center, INSTALL_DEPS=true (the key below sets false).

# Deployment directory (service installation location)
# Absolute path. The repository is copied here when it differs from the script's
# own root; it becomes the systemd WorkingDirectory, so the service resolves
# etc/conf/server.conf and the relative certificate paths from it.
# Must exist/writable for the install; the Python interpreter must remain valid
# after installation (a venv created in the source tree keeps absolute paths).
INSTALL_DIR=/OpenA2A-T/registry-center

# Python path (leave empty to use INSTALL_DIR/venv/bin/python3)
# Absolute path to the interpreter that runs `-m agent_registry.start`.
# Empty means $INSTALL_DIR/venv/bin/python3. installation fails if the file does
# not exist.
PYTHON_PATH=

# Service name
# Basename of the systemd unit: etc/systemd/<SERVICE_NAME>.service is rendered
# into /etc/systemd/system/<SERVICE_NAME>.service and used by systemctl
# start/stop/status/enable/disable.
SERVICE_NAME=registry-center

# Auto install dependencies
# true: run `<PYTHON_PATH> -m pip install -r <INSTALL_DIR>/requirements.txt`
# during install (failures only warn). false: never touch the environment, so
# dependencies must be provided in advance. This value overrides the script's
# built-in default of true.
INSTALL_DEPS=false
