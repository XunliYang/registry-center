# Operating parameters and business policies. No endpoints, credentials or feature switches.
# Keep each key in one file; switches and deployment/access settings in server.conf.
# REGISTRY_* env variables override a key only if that key already exists as an
# active line in server.conf or server.properties.
# ---- TLS (main and integration HTTPS listeners) ----
# Protocol versions to offer, highest first. NOTE: no code reads tls.version (no
# consumer in agent_registry/ or common/), so changing it has no effect. Both listeners
# therefore use Python's default TLS range for PROTOCOL_TLS_SERVER, which is TLS 1.2 to
# TLS 1.3; TLS 1.2 cannot be disabled by configuration. The value below is advisory and
# records the intended range only.
tls.version=TLSv1.3,TLSv1.2
# Cipher suites in IANA names, comma-separated; converted internally to OpenSSL names
# and applied to both the main and the integration HTTPS listeners. Unknown names are
# skipped with a warning; a missing value breaks main-listener startup. TLS 1.3 suites
# listed here are informational (TLS 1.3 suites are configured separately from the
# lower-version set_ciphers list), and the DHE-DSS entries need a DSA server certificate
# this deployment does not use.
tls.cipher=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_DHE_RSA_WITH_AES_256_GCM_SHA384,TLS_DHE_DSS_WITH_AES_256_GCM_SHA384,TLS_DHE_RSA_WITH_AES_128_GCM_SHA256,TLS_DHE_DSS_WITH_AES_128_GCM_SHA256
# Request deadline in seconds for the main API: a slower handler returns HTTP 504.
# The same value is also passed to uvicorn as timeout_graceful_shutdown, whose own
# fallback is 30. Code default 300.
connection.timeout=300
# Maximum concurrent HTTP responses on the main API (streaming bodies included, not
# TCP sockets); above it requests are rejected with HTTP 503.
# Code default 500.
connection.max=500
# ---- Per-endpoint flow control (main API) ----
# For each operation: ratelimit = requests/second allowed per client IP (excess ->
# HTTP 429); parallelism = concurrent in-flight requests per operation (excess ->
# HTTP 503). Counters are in-memory, per process, and reset on restart. Code
# fallback defaults equal the shipped values.
# register: create agent cards, POST /rest/v1/registry-center/agent-cards.
flowcontrol.ratelimit.register=50
flowcontrol.parallelism.register=50
# query: all list/read endpoints, health list/history/stream and /changes.
flowcontrol.ratelimit.query=100
flowcontrol.parallelism.query=100
# update: full replace of one card, PUT /agent-cards/{organization}/{name}.
flowcontrol.ratelimit.update=100
flowcontrol.parallelism.update=100
# get: read one card by name and organization, GET /agent-cards/{organization}/{name}.
flowcontrol.ratelimit.get=100
flowcontrol.parallelism.get=100
# retrieve: semantic/fuzzy search, POST /agent-cards/semantic-query.
flowcontrol.ratelimit.retrieve=100
flowcontrol.parallelism.retrieve=100
# deregister: remove one card, DELETE /agent-cards/{organization}/{name}.
flowcontrol.ratelimit.deregister=50
flowcontrol.parallelism.deregister=50
# jwk: unauthenticated JWKS endpoint GET /keys; parallelism 1 serializes the reads
# of the published key set.
flowcontrol.ratelimit.jwk=10
flowcontrol.parallelism.jwk=1
# heartbeat: liveness reports, POST /agent-cards/{organization}/{name}/heartbeat.
flowcontrol.ratelimit.heartbeat=100
flowcontrol.parallelism.heartbeat=100
# subscription: create/list/delete change-notification subscriptions.
flowcontrol.ratelimit.subscription=50
flowcontrol.parallelism.subscription=50
# ---- Agent capacity ----
# Maximum number of registered agent cards; a create above it returns HTTP 409.
# Also used as the Milvus list-all page size, whose own fallback is 40 when the key
# is absent. Code default 100.
agent.num.max=100

# Tag validation configuration
# Upper bound on tags per agent card; the internal set-tags operation rejects a card
# whose merged tag set exceeds it.
# Code default 10.
tag.max.count=10
# Maximum characters per tag; allowed characters are Chinese, A-Z a-z, 0-9, '.', '_',
# '-'. Code default 50.
tag.max.length=50

# Heartbeat operating parameters (seconds; offline.ttl=0 disables automatic removal).
# Expected seconds between agent heartbeats (min 1, code default 30). Health windows
# are interval + grace (healthy) and interval * failure.threshold + grace (offline);
# the value is returned to agents in the heartbeat reply.
heartbeat.interval=30
# Multiplier on interval before a silent agent is flagged suspect (min 1, default 3);
# higher values tolerate longer outages before hiding a card.
heartbeat.failure.threshold=3
# Extra seconds added to every health window to absorb jitter (min 0, default 10);
# after a restart each agent also gets one full window.
heartbeat.grace.period=10
# Seconds between background health sweeps (min 1, default 10); lower values detect
# status changes sooner at higher CPU cost.
heartbeat.sweep.interval=10
# Seconds an offline agent is kept before auto-deregistration (min 0, default 0 =
# never auto-remove); evaluated on each sweep.
heartbeat.offline.ttl=0

# Change-notification delivery policies (durations in seconds, retention in days).
# Seconds the dispatcher buffers events before flushing them to webhooks, so bursts
# are coalesced into fewer calls (default 2.0).
broadcast.debounce.window=2.0
# Per-subscription webhook send rate (default 50/s); the token-bucket capacity is
# max(2 x rate, 100) and excess events wait rather than drop.
broadcast.max.events.per.second=50
# Seconds allowed for one webhook POST before the attempt fails (default 10.0, the
# httpx client timeout).
broadcast.webhook.timeout=10
# Retries inside one delivery batch, so total in-process attempts = retries + 1
# (default 5).
broadcast.webhook.max.retries=5
# Seconds for the first retry delay (default 2.0); the delay is base x 2^attempt
# with +/-30% jitter.
broadcast.webhook.backoff.base=2
# Upper bound in seconds on that exponential retry delay (default 300.0).
broadcast.webhook.backoff.max=300
# Days an event is kept in the outbox; an hourly cleanup deletes older rows, so this
# bounds replay/recovery after an outage (default 7).
broadcast.outbox.retention.days=7
# Total delivery attempts per subscription and event across restarts (min 1,
# default 5); once spent, the delivery is abandoned.
broadcast.delivery.max.attempts=5
# Seconds between sweeps that requeue failed deliveries (default 60.0); 0 disables
# the sweep task.
broadcast.delivery.retry.interval=60

# Third-party access policies; apply only when the corresponding feature is enabled.
# These apply to the third-party listener, which is off unless integration.enabled=true
# is set in server.conf; integration.token.* also needs its own switch.
# Request rate allowed for one authenticated credential on the integration port,
# written as 'N/second' or a bare N (default 100/second). Excess requests get
# HTTP 429; it also limits token-acquisition attempts per client id.
integration.ratelimit=100/second
# Pre-authentication rate per source IP, applied before credentials are checked to
# slow credential guessing (default 50/second).
integration.preratelimit=50/second
# Consecutive authentication failures for one token fingerprint or source IP before
# that bucket is temporarily banned (default 5).
integration.ban.threshold=5
# How long a banned bucket stays blocked, in seconds (default 300).
integration.ban.cooldown_seconds=300
# Comma-separated JWT signing algorithms accepted for IAM-issued tokens (default
# RS256); 'none' is rejected and at least one entry is required.
integration.oauth2.algorithms=RS256
# Timeout in seconds for IAM calls, both the JWKS fetch and token introspection
# (default 3); must be finite and > 0.
integration.oauth2.timeout_seconds=3
# 0 = no caching; positive cache duration introduces a revocation visibility delay.
integration.oauth2.cache_seconds=0
# Capacity of the introspection result cache (default 1024, must be > 0); the oldest
# entry is evicted first.
integration.oauth2.cache_max_entries=1024
# Map an OAuth2 (or static-bearer) scope to one caller role. Valid roles: nms_oss
# (near-full access), vendor_agent (own cards only), partner_service (read +
# subscribe), analytics_tool (read-only + audit pull). A token whose scopes map to
# two different roles is rejected, and a token with no mapped scope fails
# authentication.
integration.auth.scope_role.registry.read=partner_service
integration.auth.scope_role.registry.vendor=vendor_agent
integration.auth.scope_role.registry.admin=nms_oss
integration.auth.scope_role.registry.audit=analytics_tool
# Space-separated scopes the registry may request from IAM for a caller (default
# empty); the default scope must be a subset of this list or startup fails. Applies
# only when integration.token.enabled=true.
integration.token.allowed_scopes=registry.read registry.vendor
# Scope requested when the caller does not ask for one (default empty; must be a
# subset of integration.token.allowed_scopes).
integration.token.default_scope=registry.read
# Overall cooperative deadline for built-in and custom async acquisition providers.
# Seconds, finite and > 0 (default 3); enforced as an asyncio deadline over the
# whole acquisition, including custom providers.
integration.token.timeout_seconds=3

# ---- Knowledge graph API (main API; every endpoint returns HTTP 404 unless
# knowledge_graph.enabled=true is set in server.conf) ----
# Requests per second allowed per client IP on the knowledge graph API, written as
# 'N/second' or a bare N (default 100/second); excess requests are rejected with
# HTTP 429.
knowledge_graph.ratelimit=100/second
# Comma-separated verified owner names that may read and write the graph without a
# knowledge_graph:read / knowledge_graph:write scope (default empty).
# A caller with neither a listed owner nor the scope is rejected with HTTP 403; an
# unauthenticated caller is rejected with HTTP 401 before this list is consulted.
knowledge_graph.allowed.owners=

# ---- Audit policy ----
# Also audit main-port read operations, not only writes. Default false: high-frequency
# queries stay out of the audit log to avoid flooding it, while the integration port
# always audits its reads. Set true for full read coverage.
# Archiving records to a customer MySQL database is configured separately in
# persistence.conf (audit.mysql.*).
audit.read_operations=false
