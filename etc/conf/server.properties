# Operating parameters and business policies. No endpoints, credentials or feature switches.
# Keep each key in one file; switches and deployment/access settings in server.conf.
tls.version=TLSv1.3,TLSv1.2
tls.cipher=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_DHE_RSA_WITH_AES_256_GCM_SHA384,TLS_DHE_DSS_WITH_AES_256_GCM_SHA384,TLS_DHE_RSA_WITH_AES_128_GCM_SHA256,TLS_DHE_DSS_WITH_AES_128_GCM_SHA256
connection.timeout=300
connection.max=500
flowcontrol.ratelimit.register=50
flowcontrol.parallelism.register=50
flowcontrol.ratelimit.query=100
flowcontrol.parallelism.query=100
flowcontrol.ratelimit.update=100
flowcontrol.parallelism.update=100
flowcontrol.ratelimit.get=100
flowcontrol.parallelism.get=100
flowcontrol.ratelimit.retrieve=100
flowcontrol.parallelism.retrieve=100
flowcontrol.ratelimit.deregister=50
flowcontrol.parallelism.deregister=50
flowcontrol.ratelimit.jwk=10
flowcontrol.parallelism.jwk=1
flowcontrol.ratelimit.heartbeat=100
flowcontrol.parallelism.heartbeat=100
flowcontrol.ratelimit.subscription=50
flowcontrol.parallelism.subscription=50
agent.num.max=100

# Tag validation configuration
tag.max.count=10
tag.max.length=50

# Heartbeat operating parameters (seconds; offline.ttl=0 disables automatic removal).
heartbeat.interval=30
heartbeat.failure.threshold=3
heartbeat.grace.period=10
heartbeat.sweep.interval=10
heartbeat.offline.ttl=0

# Change-notification delivery policies (durations in seconds, retention in days).
broadcast.debounce.window=2.0
broadcast.max.events.per.second=50
broadcast.webhook.timeout=10
broadcast.webhook.max.retries=5
broadcast.webhook.backoff.base=2
broadcast.webhook.backoff.max=300
broadcast.outbox.retention.days=7
broadcast.delivery.max.attempts=5
broadcast.delivery.retry.interval=60

# Third-party access policies; apply only when the corresponding feature is enabled.
integration.ratelimit=100/second
integration.preratelimit=50/second
integration.ban.threshold=5
integration.ban.cooldown_seconds=300
integration.oauth2.algorithms=RS256
integration.oauth2.timeout_seconds=3
# 0 = no caching; positive cache duration introduces a revocation visibility delay.
integration.oauth2.cache_seconds=0
integration.oauth2.cache_max_entries=1024
integration.auth.scope_role.registry.read=partner_service
integration.auth.scope_role.registry.vendor=vendor_agent
integration.auth.scope_role.registry.admin=nms_oss
integration.auth.scope_role.registry.audit=analytics_tool
integration.token.allowed_scopes=registry.read registry.vendor
integration.token.default_scope=registry.read
# Overall cooperative deadline for built-in and custom async acquisition providers.
integration.token.timeout_seconds=3
