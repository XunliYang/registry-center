# Provisioned identities for static Bearer tokens and mTLS certificates.
# Generate token_hash with:
#   python -m agent_registry.integration.token_digest
# using the same INTEGRATION_TOKEN_HMAC_KEY configured for the service.
# Never put a plaintext token in this file.
#
# File format: one "credential.<id>.<field>=<value>" line per field, parsed as
# KEY=VALUE by agent_registry/integration/credentials.py (load_credentials,
# line 47). The file is read only when integration.enabled=true. Its default
# location is etc/conf/integration_credentials.conf, overridable with the
# `integration.credential.file` key in server.conf; ${ENV_VAR} and
# ${ENV_VAR:default} placeholders are resolved at load time. A missing file is
# not an error - the service logs a warning and starts with no integration
# credentials at all (every static-Bearer and mTLS caller is then rejected).
#
# <id> is free-form (it names the entry, e.g. "operations" or "vendor") and must
# not contain a dot beyond the two separators. Fields:
#   identity    caller name recorded on audit records and used as the AgentCard
#               owner when owner is absent. Required unless cn supplies the name.
#   token_hash  HMAC-SHA-256 digest of the static Bearer token as 64 lowercase
#               hex characters: required for static Bearer access, and any
#               malformed digest (wrong length or non-hex) silently drops the
#               entire entry with a "has invalid token_hash" warning.
#   cn          client certificate Common Name for mTLS access; the CN is taken
#               from the verified TLS peer certificate, never from a header.
#               Required for mTLS unless only a token is wanted.
#   role        one of nms_oss, vendor_agent, partner_service, analytics_tool
#               (common/util/authenticate_util.py CallerRole). Required; an
#               unknown value drops the entry with an "has invalid role" warning.
#   owner       attribution metadata only - it grants no access. Defaults to
#               identity; a value that collides with another entry's identity is
#               only warned about.
#   enabled     defaults to true. Set enabled=false to keep an entry in the file
#               but inactive; the comparison is case-insensitive.
#
# An entry with neither identity/cn nor token_hash is skipped with a warning, and
# when both token_hash and cn are given the same entry serves both callers. Only
# one entry may claim a given token_hash id or CN: duplicates are reported and
# the first entry wins.
#
# static_bearer needs the matching key in server.conf as well, for example
#   integration.auth.mode=static_bearer
#   integration.auth.static.hmac_key=${INTEGRATION_TOKEN_HMAC_KEY}
# (that key and integration.credential.file are absent from
# etc/conf/server.conf.example, so add them explicitly; see
# docs/en/Registry Center Integration Guide.md).
#
# Container deployments: .dockerignore excludes this file from the image, so it
# must be mounted read-only at runtime.

# credential.operations.identity=operations-service
# credential.operations.token_hash=<64 lowercase hexadecimal characters>
# credential.operations.role=nms_oss
# credential.operations.owner=operations-service
# credential.operations.enabled=true

# credential.vendor.identity=vendor-service
# credential.vendor.cn=vendor-service.example
# credential.vendor.role=vendor_agent
# credential.vendor.owner=vendor-service
