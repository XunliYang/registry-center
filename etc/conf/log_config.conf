# Maximum size of the active audit log in MB before it rotates (default 5; integer MB).
# The size is checked before each write, so the file can exceed it by one record.
audit_log_max_file_size_mb=5
# Rotated backups kept as audit.log.1 ... audit.log.N; the oldest is deleted on rotation.
# 4 here means audit.log plus 4 backups (5 files); the code fallback is 5 when unset.
audit_log_backup_count=4